<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotweb Theme Customizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;

            height: 100vh;
            overflow: hidden;
        }
        
        .sidebar {
            width: 350px;
            background: white;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            overflow-y: auto;
            padding: 20px;
        }
        
        .preview-panel {
            flex: 1;
            background: #e0e0e0;
            position: relative;
            overflow: hidden;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #2196F3;
            padding-bottom: 5px;
        }
        
        .color-control {
            margin-bottom: 15px;
        }
        
        .color-label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        
        .color-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        input[type="color"] {
            width: 60px;
            height: 40px;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        
        .preset-themes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .preset-btn {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .preset-btn:hover {
            border-color: #2196F3;
            background: #f0f7ff;
        }
        
        .preset-btn.active {
            border-color: #2196F3;
            background: #2196F3;
            color: white;
        }
        
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #2196F3;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1976D2;
        }
        
        .btn-success {
            background: #4CAF50;
            color: white;
        }
        
        .btn-success:hover {
            background: #45a049;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        .toolbar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            display: flex;
            gap: 10px;
        }
        
        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .switch {
            position: relative;
            width: 50px;
            height: 24px;
            background: #ccc;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .switch.active {
            background: #2196F3;
        }
        
        .switch::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: 0.3s;
        }
        
        .switch.active::after {
            left: 29px;
        }
        
        .code-output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
    </style>
</head>
<body>

        <div class="section">

            <div class="color-control">

                <div class="color-input-group">

            <div class="color-control">

                    <input type="color" id="cat3Color" value="#ef4444">

                </div>
            </div>
        
        <div class="section">
            <div class="section-title">⚙️ Options</div>
            
            <div class="toggle-switch">
                <span>Use Gradients</span>
                <div class="switch" id="gradientToggle"></div>
            </div>
            
            <div class="toggle-switch">
                <span>Add Glow Effects</span>
                <div class="switch" id="glowToggle"></div>
            </div>
            
            <div class="toggle-switch">
                <span>Rounded Corners</span>
                <div class="switch active" id="roundedToggle"></div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">💾 Export</div>
            <div class="actions">
                <button class="btn-success" onclick="downloadCSS()">📥 Download CSS</button>
                <button class="btn-primary" onclick="copyToClipboard()">📋 Copy to Clipboard</button>
                <button class="btn-secondary" onclick="resetTheme()">🔄 Reset to Default</button>
            </div>
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;">
                <a href="theme-upload.php" style="display: block; text-align: center; padding: 12px; background: #f0f0f0; border-radius: 6px; text-decoration: none; color: #333; font-weight: 600; transition: background 0.2s;" onmouseover="this.style.background='#e0e0e0'" onmouseout="this.style.background='#f0f0f0'">
                    📤 Upload Theme to Spotweb
                </a>
            </div>
        </div>
    </div>
    
    <div class="preview-panel">
        <div class="toolbar">
            <button class="btn-secondary" onclick="toggleView('table')">📊 Table View</button>
            <button class="btn-secondary" onclick="toggleView('details')">📄 Details View</button>
        </div>
        <iframe id="preview" class="preview-frame"></iframe>
    </div>
    
    <script>
        const presets = [
            { id: 'dark', name: '🌙 Dark', colors: { 
                bg: '#1e1e1e', text: '#e0e0e0', primary: '#0553a1', secondary: '#2d2d2d', hover: '#333333', border: '#444444',
                link: '#0553a1', linkHover: '#3886d4', accent: '#0553a1', oddRow: '#252525', thBg: '#333333'
            }},
            { id: 'midnight', name: '🌊 Midnight', colors: { 
                bg: '#0a192f', text: '#ccd6f6', primary: '#64ffda', secondary: '#1d2d50', hover: '#233554', border: '#233554',
                link: '#64ffda', linkHover: '#8cffee', accent: '#64ffda', oddRow: '#0f2138', thBg: '#1d2d50'
            }},
            { id: 'cyberpunk', name: '🎮 Cyberpunk', colors: { 
                bg: '#0d0221', text: '#00ff41', primary: '#ff006e', secondary: '#1a0b2e', hover: '#2d1b3d', border: '#ff006e',
                link: '#00d4ff', linkHover: '#00ff41', accent: '#ffbe0b', oddRow: '#120828', thBg: '#2d1b3d'
            }},
            { id: 'nord', name: '❄️ Nord', colors: { 
                bg: '#2e3440', text: '#d8dee9', primary: '#88c0d0', secondary: '#3b4252', hover: '#434c5e', border: '#434c5e',
                link: '#88c0d0', linkHover: '#8fbcbb', accent: '#81a1c1', oddRow: '#353a47', thBg: '#3b4252'
            }},
            { id: 'dracula', name: '🧛 Dracula', colors: { 
                bg: '#282a36', text: '#f8f8f2', primary: '#ff79c6', secondary: '#44475a', hover: '#6272a4', border: '#6272a4',
                link: '#8be9fd', linkHover: '#50fa7b', accent: '#bd93f9', oddRow: '#21222c', thBg: '#44475a',
                cat0: '#8be9fd', cat1: '#50fa7b', cat2: '#f1fa8c', cat3: '#ffb86c'
            }},
            { id: 'forest', name: '🌲 Forest', colors: { 
                bg: '#1a3a2a', text: '#c9dac8', primary: '#7fbf7f', secondary: '#2d4a3e', hover: '#3a5f4e', border: '#2d4a3e',
                link: '#7fbf7f', linkHover: '#a4d4a4', accent: '#5a9e5a', oddRow: '#1f3f2f', thBg: '#2d4a3e'
            }},
            { id: 'sunset', name: '🌅 Sunset', colors: { 
                bg: '#1a1625', text: '#ffd6ba', primary: '#ff9a76', secondary: '#3d1f47', hover: '#5e2750', border: '#5e2750',
                link: '#ff9a76', linkHover: '#ffb699', accent: '#ffb0a1', oddRow: '#211829', thBg: '#3d1f47'
            }},
            { id: 'spring', name: '🌸 Spring', colors: { 
                bg: '#e8f5e8', text: '#2e7d32', primary: '#e91e63', secondary: '#c8e6c9', hover: '#a5d6a7', border: '#a5d6a7',
                link: '#1b5e20', linkHover: '#4caf50', accent: '#e91e63', oddRow: '#f1f8e9', thBg: '#c8e6c9'
            }},
            { id: 'summer', name: '☀️ Summer', colors: { 
                bg: '#e3f2fd', text: '#0d47a1', primary: '#ffd54f', secondary: '#bbdefb', hover: '#90caf9', border: '#64b5f6',
                link: '#0d47a1', linkHover: '#42a5f5', accent: '#ffd54f', oddRow: '#f3e5f5', thBg: '#90caf9'
            }},
            { id: 'autumn', name: '🍂 Autumn', colors: { 
                bg: '#fff3e0', text: '#bf360c', primary: '#e65100', secondary: '#ffcc80', hover: '#fb8c00', border: '#f57c00',
                link: '#8d6e63', linkHover: '#fb8c00', accent: '#e65100', oddRow: '#ffe0b2', thBg: '#fb8c00'
            }},
            { id: 'winter', name: '⛄ Winter', colors: { 
                bg: '#f5f5f5', text: '#263238', primary: '#00bcd4', secondary: '#e0f2f1', hover: '#b0bec5', border: '#90a4ae',
                link: '#37474f', linkHover: '#00bcd4', accent: '#00bcd4', oddRow: '#eceff1', thBg: '#b0bec5'
            }},
            { id: 'custom', name: '✨ Custom', colors: null }
        ];
        
        let currentColors = presets[0].colors;
        // Set defaults for category colors if not in preset
        currentColors.cat0 = currentColors.cat0 || '#3b82f6';
        currentColors.cat1 = currentColors.cat1 || '#f59e0b';
        currentColors.cat2 = currentColors.cat2 || '#22c55e';
        currentColors.cat3 = currentColors.cat3 || '#ef4444';
        let useGradients = false;
        let useGlow = false;
        let useRounded = true;
        
        // Initialize
        renderPresets();
        setupColorInputs();
        setupToggles();
        updatePreview();
        
        function renderPresets() {
            const container = document.getElementById('presetThemes');
            presets.forEach(preset => {
                const btn = document.createElement('button');
                btn.className = 'preset-btn';
                btn.textContent = preset.name;
                btn.onclick = () => loadPreset(preset);
                container.appendChild(btn);
            });
        }
        
        function loadPreset(preset) {
            if (!preset.colors) return;
            
            currentColors = {...preset.colors};
            
            // Update color pickers
            Object.keys(currentColors).forEach(key => {
                const picker = document.getElementById(key + 'Color');
                const text = document.getElementById(key + 'ColorText');
                if (picker && text) {
                    picker.value = currentColors[key];
                    text.value = currentColors[key];
                }
            });
            
            updatePreview();
            
            // Update active state
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        function setupColorInputs() {
            const colorKeys = ['bg', 'text', 'primary', 'secondary', 'hover', 'border', 'cat0', 'cat1', 'cat2', 'cat3'];
            
            colorKeys.forEach(key => {
                const picker = document.getElementById(key + 'Color');
                const text = document.getElementById(key + 'ColorText');
                
                if (picker && text) {
                    picker.addEventListener('input', (e) => {
                        currentColors[key] = e.target.value;
                        text.value = e.target.value;
                        updatePreview();
                    });
                    
                    text.addEventListener('input', (e) => {
                        currentColors[key] = e.target.value;
                        picker.value = e.target.value;
                        updatePreview();
                    });
                }
            });
        }
        
        function setupToggles() {
            document.getElementById('gradientToggle').onclick = function() {
                useGradients = !useGradients;
                this.classList.toggle('active');
                updatePreview();
            };
            
            document.getElementById('glowToggle').onclick = function() {
                useGlow = !useGlow;
                this.classList.toggle('active');
                updatePreview();
            };
            
            document.getElementById('roundedToggle').onclick = function() {
                useRounded = !useRounded;
                this.classList.toggle('active');
                updatePreview();
            };
        }
        
        function updatePreview() {
            const css = generateCSS();
            const html = generatePreviewHTML();
            
            const iframe = document.getElementById('preview');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <html>
                <head>
                    <style>${css}</style>
                </head>
                <body>${html}</body>
                </html>
            `);
            doc.close();
        }
        
        function generateCSS() {
            const themeName = 'custom';
            const bg = useGradients ? `linear-gradient(135deg, ${currentColors.bg} 0%, ${adjustBrightness(currentColors.bg, 20)} 100%)` : currentColors.bg;
            const glow = useGlow ? `text-shadow: 0 0 10px ${currentColors.primary};` : '';
            const radius = useRounded ? '6px' : '0';
            
            return `
                body {
                    background: ${bg};
                    color: ${currentColors.text};
                    font-family: Arial, sans-serif;
                    padding: 20px;
                    margin: 0;
                }
                
                .header {
                    background: ${currentColors.secondary};
                    padding: 20px;
                    border-radius: ${radius};
                    margin-bottom: 20px;
                }
                
                h1 {
                    color: ${currentColors.primary};
                    ${glow}
                    margin: 0;
                }
                
                table {
                    width: 100%;
                    background: ${currentColors.secondary};
                    border-collapse: collapse;
                    border-radius: ${radius};
                    overflow: hidden;
                }
                
                th {
                    background: ${currentColors.hover};
                    color: ${currentColors.primary};
                    padding: 12px;
                    text-align: left;
                    border-bottom: 2px solid ${currentColors.border};
                }
                
                td {
                    padding: 12px;
                    border-bottom: 1px solid ${currentColors.border};
                    color: ${currentColors.text};
                }
                
                tr:hover {
                    background: ${currentColors.hover};
                }
                
                a {
                    color: ${currentColors.primary};
                    text-decoration: none;
                }
                
                a:hover {
                    ${glow}
                }
            `;
        }
        
        function generatePreviewHTML() {
            return `
                <div class="header">
                    <h1>Custom Theme Preview</h1>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Title</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Movies</td>
                            <td><a href="#">Example Movie Title 2024</a></td>
                            <td>Dec 08, 2025</td>
                        </tr>
                        <tr>
                            <td>TV</td>
                            <td><a href="#">TV Show S01E01</a></td>
                            <td>Dec 08, 2025</td>
                        </tr>
                        <tr>
                            <td>Music</td>
                            <td><a href="#">Album Name - Artist</a></td>
                            <td>Dec 08, 2025</td>
                        </tr>
                    </tbody>
                </table>
            `;
        }
        
        function generateFullCSS(themeName = 'custom') {
            
            // Use preset-specific colors if available, otherwise derive from base colors
            const link = currentColors.link || currentColors.primary;
            const linkHover = currentColors.linkHover || adjustBrightness(link, 20);
            const accent = currentColors.accent || currentColors.primary;
            const oddRow = currentColors.oddRow || adjustBrightness(currentColors.bg, 5);
            const thBg = currentColors.thBg || currentColors.secondary;
            
            // Category colors - use specific ones if available (like Dracula), otherwise derive
            const cat0 = currentColors.cat0 || adjustHue(currentColors.primary, 0);
            const cat1 = currentColors.cat1 || adjustHue(currentColors.primary, 30);
            const cat2 = currentColors.cat2 || adjustHue(currentColors.primary, 60);
            const cat3 = currentColors.cat3 || adjustHue(currentColors.primary, 90);
            
            const bgGradient = useGradients ? 
                `linear-gradient(135deg, ${currentColors.bg} 0%, ${adjustBrightness(currentColors.bg, 15)} 50%, ${adjustBrightness(currentColors.bg, 25)} 100%)` : 
                currentColors.bg;
            const toolbarGradient = useGradients ?
                `linear-gradient(180deg, ${currentColors.secondary} 0%, ${currentColors.hover} 100%)` :
                currentColors.secondary;
            const thGradient = useGradients ?
                `linear-gradient(180deg, ${thBg} 0%, ${currentColors.hover} 100%)` :
                thBg;
            const glow = useGlow ? `text-shadow: 0 0 10px ${hexToRgba(currentColors.primary, 0.5)};` : '';
            const glowStrong = useGlow ? `text-shadow: 0 0 15px ${hexToRgba(currentColors.primary, 0.7)};` : '';
            const boxGlow = useGlow ? `box-shadow: 0 0 30px ${hexToRgba(currentColors.primary, 0.3)};` : '';
            
            return `/* CUSTOM SPOTWEB THEME */
/* Generated with Theme Customizer */

:root[data-sw-theme="${themeName}"] {
    --color-bg: ${currentColors.bg};
    --color-surface: ${oddRow};
    --color-surface-2: ${thBg};
    --color-border: ${hexToRgba(currentColors.primary, 0.22)};
    --color-text: ${currentColors.text};
    --color-muted: ${hexToRgba(currentColors.text, 0.75)};
    --color-accent: ${accent};
    --sw-strip-gradient: ${toolbarGradient};
    --sw-strip-border: ${hexToRgba(currentColors.primary, 0.25)};
    --sw-strip-text: ${adjustBrightness(currentColors.text, 10)};

    --sw-cat0: ${cat0};
    --sw-cat1: ${cat1};
    --sw-cat2: ${cat2};
    --sw-cat3: ${cat3};
}

/* GENERAL */
body.theme-${themeName} {
    background: ${bgGradient};
    color: ${currentColors.text};
}

body.theme-${themeName} a:visited,
body.theme-${themeName} a:link {
    color: ${link};
    ${useGradients ? 'transition: all 0.3s ease;' : ''}
}

body.theme-${themeName} a:hover {
    color: ${linkHover};
    text-decoration: underline;
    ${glow}
}

/* HEADER */
body.theme-${themeName} div.container {
    background: transparent;
}

body.theme-${themeName} div.logo h1 a {
    color: ${currentColors.primary};
    ${glowStrong}
}

body.theme-${themeName} div.filter h4 {
    color: ${currentColors.text};
}

/* MENU */
body.theme-${themeName} ul.mainmenu li a {
    color: ${currentColors.text};
}

body.theme-${themeName} ul.mainmenu li:hover {
    ${useGradients ? `background: linear-gradient(90deg, ${hexToRgba(currentColors.primary, 0.2)} 0%, transparent 100%);` : `background-color: ${currentColors.hover};`}
}

body.theme-${themeName} ul.mainmenu li.active {
    ${useGradients ? `background: linear-gradient(90deg, ${hexToRgba(currentColors.primary, 0.3)} 0%, transparent 100%);` : `background-color: ${currentColors.hover};`}
    border-left: 3px solid ${currentColors.primary};

        }
        
        function hexToRgba(hex, alpha) {
            const num = parseInt(hex.replace('#', ''), 16);
            const r = (num >> 16);
            const g = (num >> 8 & 0x00FF);
            const b = (num & 0x0000FF);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        
        function adjustHue(hex, degrees) {
            // Simple hue shift by adjusting RGB channels
            const num = parseInt(hex.replace('#', ''), 16);
            let r = (num >> 16);
            let g = (num >> 8 & 0x00FF);
            let b = (num & 0x0000FF);
            
            // Rotate colors based on degrees
            const shift = Math.floor(degrees / 60);
            const temp = [r, g, b];
            r = temp[shift % 3];
            g = temp[(shift + 1) % 3];
            b = temp[(shift + 2) % 3];
            
            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }
        
        function downloadCSS() {
            // Prompt for theme name
            const themeName = prompt('Enter theme name (lowercase, hyphens only):\nExample: my-custom-theme', 'custom');
            if (!themeName) return; // User cancelled
            
            // Sanitize theme name
            const sanitizedName = themeName.toLowerCase().replace(/[^a-z0-9\-]/g, '');
            if (!sanitizedName) {
                alert('Invalid theme name! Use only lowercase letters, numbers, and hyphens.');
                return;
            }
            
            const css = generateFullCSS(sanitizedName);
            const blob = new Blob([css], { type: 'text/css' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'theme-' + sanitizedName + '.css';
            a.click();
        }
        
        function copyToClipboard() {
            // Prompt for theme name
            const themeName = prompt('Enter theme name (lowercase, hyphens only):\nExample: my-custom-theme', 'custom');
            if (!themeName) return; // User cancelled
            
            // Sanitize theme name
            const sanitizedName = themeName.toLowerCase().replace(/[^a-z0-9\-]/g, '');
            if (!sanitizedName) {
                alert('Invalid theme name! Use only lowercase letters, numbers, and hyphens.');
                return;
            }
            
            const css = generateFullCSS(sanitizedName);
            navigator.clipboard.writeText(css).then(() => {
                alert('✓ CSS copied to clipboard!\nTheme name: ' + sanitizedName);
            });
        }
        
        function resetTheme() {
            loadPreset(presets[0]);
        }
        
        function toggleView(view) {
            // Preview different views
            updatePreview();
        }
        
        function adjustBrightness(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const red = (num >> 16) + amt;
            const green = (num >> 8 & 0x00FF) + amt;
            const blue = (num & 0x0000FF) + amt;
            
            const clampedRed = red < 255 ? (red < 1 ? 0 : red) : 255;
            const clampedGreen = green < 255 ? (green < 1 ? 0 : green) : 255;
            const clampedBlue = blue < 255 ? (blue < 1 ? 0 : blue) : 255;
            
            return '#' + (0x1000000 + clampedRed * 0x10000 + clampedGreen * 0x100 + clampedBlue)
                .toString(16).slice(1);
        }
