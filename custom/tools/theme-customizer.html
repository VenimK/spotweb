                link: '#1b5e20', linkHover: '#4caf50', accent: '#e91e63', oddRow: '#f1f8e9', evenRow: '#e8f5e8', thBg: '#c8e6c9',

            }},
            { id: 'summer', name: '☀️ Summer', colors: { 
                bg: '#e3f2fd', text: '#0d47a1', primary: '#ffd54f', secondary: '#bbdefb', hover: '#90caf9', border: '#64b5f6',
                link: '#0d47a1', linkHover: '#42a5f5', accent: '#ffd54f', oddRow: '#f3e5f5', evenRow: '#e3f2fd', thBg: '#90caf9',
                cat0: '#ffd54f', cat1: '#4caf50', cat2: '#ffeb3b', cat3: '#ff5722',
                detailsBg: '#e3f2fd', detailsTitle: '#0d47a1', description: '#0d47a1'
            }},
            { id: 'autumn', name: '🍂 Autumn', colors: { 
                bg: '#fff3e0', text: '#bf360c', primary: '#e65100', secondary: '#ffcc80', hover: '#fb8c00', border: '#f57c00',
                link: '#8d6e63', linkHover: '#fb8c00', accent: '#e65100', oddRow: '#ffe0b2', evenRow: '#fff3e0', thBg: '#fb8c00',
                cat0: '#e65100', cat1: '#8d6e63', cat2: '#ffa726', cat3: '#d32f2f',
                detailsBg: '#fff3e0', detailsTitle: '#bf360c', description: '#bf360c'
            }},
            { id: 'winter', name: '⛄ Winter', colors: { 
                bg: '#f5f5f5', text: '#263238', primary: '#00bcd4', secondary: '#e0f2f1', hover: '#b0bec5', border: '#90a4ae',
                link: '#37474f', linkHover: '#00bcd4', accent: '#00bcd4', oddRow: '#eceff1', evenRow: '#f5f5f5', thBg: '#b0bec5',
                cat0: '#00bcd4', cat1: '#4db6ac', cat2: '#81d4fa', cat3: '#ef5350',
                detailsBg: '#f5f5f5', detailsTitle: '#263238', description: '#263238'
            }},
            { id: 'custom', name: '✨ Custom', colors: null }
        ];
        
        let currentColors = presets[0].colors;
        let useGradients = false;
        let useGlow = false;
        let useRounded = true;
        
        // Initialize
        renderPresets();
        setupColorInputs();
        setupToggles();
        updatePreview();
        
        function renderPresets() {
            const container = document.getElementById('presetThemes');
            presets.forEach(preset => {
                const btn = document.createElement('button');
                btn.className = 'preset-btn';
                btn.textContent = preset.name;
                btn.onclick = () => loadPreset(preset);
                container.appendChild(btn);
            });
        }
        
        function loadPreset(preset) {
            if (!preset.colors) return;
            
            currentColors = {...preset.colors};
            
            // Update color pickers
            Object.keys(currentColors).forEach(key => {
                const picker = document.getElementById(key + 'Color');
                const text = document.getElementById(key + 'ColorText');
                if (picker && text) {
                    picker.value = currentColors[key];
                    text.value = currentColors[key];
                }
            });
            
            updatePreview();
            
            // Update active state
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        function setupColorInputs() {
            const colorKeys = ['bg', 'text', 'primary', 'secondary', 'hover', 'border', 'link', 'linkHover', 'thBg', 'oddRow', 'evenRow', 'cat0', 'cat1', 'cat2', 'cat3', 'detailsBg', 'detailsTitle', 'description'];
            
            colorKeys.forEach(key => {
                const picker = document.getElementById(key + 'Color');
                const text = document.getElementById(key + 'ColorText');
                
                if (picker && text) {
                    picker.addEventListener('input', (e) => {
                        currentColors[key] = e.target.value;
                        text.value = e.target.value;
                        updatePreview();
                    });
                    
                    text.addEventListener('input', (e) => {
                        currentColors[key] = e.target.value;
                        picker.value = e.target.value;
                        updatePreview();
                    });
                }
            });
        }
        
        function setupToggles() {
            document.getElementById('gradientToggle').onclick = function() {
                useGradients = !useGradients;
                this.classList.toggle('active');
                updatePreview();
            };
            
            document.getElementById('glowToggle').onclick = function() {
                useGlow = !useGlow;
                this.classList.toggle('active');
                updatePreview();
            };
            
            document.getElementById('roundedToggle').onclick = function() {
                useRounded = !useRounded;
                this.classList.toggle('active');
                updatePreview();
            };
        }
        
        function updatePreview() {
            const css = generateCSS();
            const html = generatePreviewHTML();
            
            const iframe = document.getElementById('preview');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <html>
                <head>
                    <style>${css}</style>
                </head>
                <body>${html}</body>
                </html>
            `);
            doc.close();
        }
        
        function generateCSS() {
            const themeName = 'custom';
            const bg = useGradients ? `linear-gradient(135deg, ${currentColors.bg} 0%, ${adjustBrightness(currentColors.bg, 20)} 100%)` : currentColors.bg;
            const glow = useGlow ? `text-shadow: 0 0 10px ${currentColors.primary};` : '';
            const radius = useRounded ? '6px' : '0';
            
            // Get all color values with fallbacks
            const link = currentColors.link || currentColors.primary;
            const linkHover = currentColors.linkHover || adjustBrightness(link, 20);
            const thBg = currentColors.thBg || currentColors.secondary;
            const oddRow = currentColors.oddRow || adjustBrightness(currentColors.bg, 5);
            const evenRow = currentColors.evenRow || currentColors.bg;
            const cat0 = currentColors.cat0 || '#4da6ff';
            const cat1 = currentColors.cat1 || '#66cc66';
            const cat2 = currentColors.cat2 || '#ffcc00';
            const cat3 = currentColors.cat3 || '#ff6666';
            const detailsBg = currentColors.detailsBg || currentColors.secondary;
            const detailsTitle = currentColors.detailsTitle || currentColors.text;
            const description = currentColors.description || currentColors.text;
            
            return `
                * { box-sizing: border-box; }
                body {
                    background: ${bg};

        function hexToRgba(hex, alpha) {
            const num = parseInt(hex.replace('#', ''), 16);
            const r = (num >> 16);
            const g = (num >> 8 & 0x00FF);
            const b = (num & 0x0000FF);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        
        function adjustHue(hex, degrees) {
            // Simple hue shift by adjusting RGB channels
            const num = parseInt(hex.replace('#', ''), 16);
            let r = (num >> 16);
            let g = (num >> 8 & 0x00FF);
            let b = (num & 0x0000FF);
            
            // Rotate colors based on degrees
            const shift = Math.floor(degrees / 60);
            const temp = [r, g, b];
            r = temp[shift % 3];
            g = temp[(shift + 1) % 3];
            b = temp[(shift + 2) % 3];
            
            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }
        
        function downloadCSS() {
            // Prompt for theme name
            const themeName = prompt('Enter theme name (lowercase, hyphens only):\nExample: my-custom-theme', 'custom');
            if (!themeName) return; // User cancelled
            
            // Sanitize theme name
            const sanitizedName = themeName.toLowerCase().replace(/[^a-z0-9\-]/g, '');
            if (!sanitizedName) {
                alert('Invalid theme name! Use only lowercase letters, numbers, and hyphens.');
                return;
            }
            
            const css = generateFullCSS(sanitizedName);
            const blob = new Blob([css], { type: 'text/css' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'theme-' + sanitizedName + '.css';
            a.click();
        }
        
        function copyToClipboard() {
            // Prompt for theme name
            const themeName = prompt('Enter theme name (lowercase, hyphens only):\nExample: my-custom-theme', 'custom');
            if (!themeName) return; // User cancelled
            
            // Sanitize theme name
            const sanitizedName = themeName.toLowerCase().replace(/[^a-z0-9\-]/g, '');
            if (!sanitizedName) {
                alert('Invalid theme name! Use only lowercase letters, numbers, and hyphens.');
                return;
            }
            
            const css = generateFullCSS(sanitizedName);
            navigator.clipboard.writeText(css).then(() => {
                alert('✓ CSS copied to clipboard!\nTheme name: ' + sanitizedName);
            });
        }

            updatePreview();
        }
        
        function adjustBrightness(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const red = (num >> 16) + amt;
            const green = (num >> 8 & 0x00FF) + amt;
            const blue = (num & 0x0000FF) + amt;
            
            const clampedRed = red < 255 ? (red < 1 ? 0 : red) : 255;
            const clampedGreen = green < 255 ? (green < 1 ? 0 : green) : 255;
            const clampedBlue = blue < 255 ? (blue < 1 ? 0 : blue) : 255;
            
            return '#' + (0x1000000 + clampedRed * 0x10000 + clampedGreen * 0x100 + clampedBlue)
                .toString(16).slice(1);
        }
